<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FaceRead | Brutal Engine V3.0</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
    
    <style>
        :root { --brand: #00FF00; --bg: #050505; --panel: #0a0a0a; --text: #d0d0d0; --alert: #FF0033; --muted: #444; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body { background-color: var(--bg); color: var(--text); padding: 15px; font-size: 13px; }
        header { text-align: center; margin-bottom: 20px; border-bottom: 1px solid #222; padding-bottom: 15px; }
        h1 { color: var(--brand); letter-spacing: 1px; font-size: 20px; margin-bottom: 5px;}
        
        .upload-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; margin-bottom: 10px; }
        .upload-btn { background: #111; color: var(--brand); border: 1px solid var(--brand); padding: 12px 5px; text-align: center; text-transform: uppercase; cursor: pointer; font-size: 11px; font-weight: bold; }
        .upload-btn:hover { background: var(--brand); color: #000; }
        input[type="file"] { display: none; }
        
        #executeBtn { width: 100%; background: var(--alert); color: #FFF; border: none; padding: 15px; font-size: 16px; font-weight: bold; text-transform: uppercase; cursor: pointer; margin-bottom: 20px; display: none; letter-spacing: 2px; }
        #executeBtn:hover { background: #CC0022; }

        .vision-container { display: flex; gap: 5px; overflow-x: auto; margin-bottom: 15px; padding-bottom: 5px; }
        .canvas-wrapper { position: relative; min-width: 150px; flex: 1; border: 1px solid #333; background: #000; min-height: 150px; }
        canvas { width: 100%; height: auto; display: block; }
        .angle-label { position: absolute; top: 2px; left: 4px; color: var(--brand); font-size: 10px; background: rgba(0,0,0,0.7); padding: 2px; z-index: 10; }
        
        .report-panel { background: var(--panel); border: 1px solid #222; display: none; margin-top: 10px; padding: 10px; }
        .grid-25 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; }
        
        .section-header { background: #111; color: var(--brand); padding: 8px; font-weight: bold; text-transform: uppercase; border-bottom: 1px solid #333; border-top: 1px solid #333; margin: 20px 0 10px 0; grid-column: 1 / -1; }
        .trait-block { background: #0f0f0f; border: 1px solid #222; padding: 12px; border-left: 3px solid var(--muted); }
        .trait-block.highlight { border-left-color: var(--brand); }
        .trait-block.danger { border-left-color: var(--alert); }
        
        .trait-num { font-size: 10px; color: #666; margin-bottom: 4px; display: block; }
        .trait-title { color: #FFF; font-weight: bold; margin-bottom: 6px; font-size: 13px; text-transform: uppercase; }
        .trait-desc { color: #AAA; line-height: 1.4; font-size: 12px; }
        .metric { color: #555; font-size: 10px; display: block; margin-top: 6px; font-family: monospace; }
        
        #loading { text-align: center; color: var(--brand); display: none; font-weight: bold; margin: 20px 0; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% {opacity: 1;} 50% {opacity: 0.3;} }
    </style>
</head>
<body>

    <header>
        <h1>FaceRead // Engine V3.0</h1>
        <p style="color: #666;">25-Point Morphopsychology Matrix</p>
    </header>

    <div class="upload-grid">
        <label class="upload-btn" id="lbl-front">Front<input type="file" id="up-front" accept="image/*"></label>
        <label class="upload-btn" id="lbl-left">L-Profile<input type="file" id="up-left" accept="image/*"></label>
        <label class="upload-btn" id="lbl-right">R-Profile<input type="file" id="up-right" accept="image/*"></label>
    </div>

    <button id="executeBtn">Execute 25-Point Analysis</button>

    <div class="vision-container">
        <div class="canvas-wrapper"><div class="angle-label">FRONT</div><canvas id="canv-front"></canvas></div>
        <div class="canvas-wrapper"><div class="angle-label">L-PROF</div><canvas id="canv-left"></canvas></div>
        <div class="canvas-wrapper"><div class="angle-label">R-PROF</div><canvas id="canv-right"></canvas></div>
    </div>
    
    <div id="loading">INITIALIZING NEURAL PIPELINE...</div>
    <div class="report-panel" id="report">
        <div class="grid-25" id="report-grid"></div>
    </div>

<script>
    const inputs = { front: document.getElementById('up-front'), left: document.getElementById('up-left'), right: document.getElementById('up-right') };
    const canvases = { front: document.getElementById('canv-front'), left: document.getElementById('canv-left'), right: document.getElementById('canv-right') };
    const executeBtn = document.getElementById('executeBtn');
    const loading = document.getElementById('loading');
    const reportPanel = document.getElementById('report');
    const reportGrid = document.getElementById('report-grid');
    
    let sourceImages = { front: null, left: null, right: null };
    let meshData = { front: null, left: null, right: null };
    
    let processingQueue = [];
    let currentProcessingAngle = null;

    // Initialize CNN with drastically lowered confidence to force side-profile detection
    const faceMesh = new FaceMesh({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`});
    faceMesh.setOptions({ 
        maxNumFaces: 1, 
        refineLandmarks: true, 
        minDetectionConfidence: 0.1, // Dropped to catch heavy angles
        minTrackingConfidence: 0.1 
    });
    
    faceMesh.onResults(handleInferenceResults);

    // Image Upload Handlers
    Object.keys(inputs).forEach(angle => {
        inputs[angle].addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(!file) return;
            
            document.getElementById(`lbl-${angle}`).style.background = '#333';
            
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const canv = canvases[angle];
                    const ctx = canv.getContext('2d');
                    canv.width = img.width;
                    canv.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    sourceImages[angle] = img;
                    
                    if(sourceImages.front) executeBtn.style.display = 'block';
                };
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        });
    });

    // Execution Pipeline
    executeBtn.addEventListener('click', () => {
        if (!sourceImages.front) return alert("Front image is strictly required.");
        
        executeBtn.style.display = 'none';
        reportPanel.style.display = 'none';
        loading.style.display = 'block';
        
        // Queue up whichever images were uploaded
        processingQueue = ['front', 'left', 'right'].filter(a => sourceImages[a]);
        processNextInQueue();
    });

    async function processNextInQueue() {
        if (processingQueue.length === 0) {
            loading.style.display = 'none';
            executeBtn.style.display = 'block';
            executeBtn.innerText = "RE-RUN MATRIX";
            generate25PointReport();
            return;
        }
        
        currentProcessingAngle = processingQueue.shift();
        loading.innerText = `EXTRACTING ${currentProcessingAngle.toUpperCase()} GEOMETRY...`;
        
        try {
            await faceMesh.send({image: sourceImages[currentProcessingAngle]});
        } catch (err) {
            console.error(`Error processing ${currentProcessingAngle}`, err);
            meshData[currentProcessingAngle] = null;
            processNextInQueue(); // continue to next even if one fails
        }
    }

    function handleInferenceResults(results) {
        if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
            const lm = results.multiFaceLandmarks[0];
            meshData[currentProcessingAngle] = lm;
            
            // Draw visual mesh feedback
            const canv = canvases[currentProcessingAngle];
            const ctx = canv.getContext('2d');
            const w = canv.width, h = canv.height;
            
            ctx.strokeStyle = currentProcessingAngle === 'front' ? 'rgba(0, 255, 0, 0.7)' : 'rgba(0, 150, 255, 0.7)'; 
            ctx.lineWidth = 1.0;
            lm.forEach(p => { ctx.beginPath(); ctx.arc(p.x*w, p.y*h, 1, 0, 2*Math.PI); ctx.stroke(); });
        } else {
            console.warn(`Mesh failed for ${currentProcessingAngle}`);
            meshData[currentProcessingAngle] = null;
        }
        processNextInQueue();
    }

    // Geometry Helpers
    function calcD(p1, p2, w, h) { return Math.sqrt(Math.pow((p1.x - p2.x)*w, 2) + Math.pow((p1.y - p2.y)*h, 2)); }
    function calcA(p1, p2) { return Math.atan2(p2.y - p1.y, p2.x - p1.x) * (180 / Math.PI); }

    function generate25PointReport() {
        if (!meshData.front) return alert("Engine failed to extract core frontal mesh.");
        
        const f = meshData.front;
        const w = canvases.front.width;
        const h = canvases.front.height;
        
        // --- CORE MATH EXTRACTION ---
        const bizygomatic = calcD(f[234], f[454], w, h);
        const midfaceH = calcD(f[10], f[152], w, h);
        const jawW = calcD(f[132], f[361], w, h);
        const fWHR = bizygomatic / midfaceH;
        
        const lTilt = calcA(f[33], f[133]);
        const rTilt = calcA(f[362], f[263]);
        const avgTilt = -((lTilt + rTilt) / 2);
        
        const ipd = calcD(f[133], f[362], w, h);
        const eyeW = calcD(f[33], f[133], w, h);
        const eyeSpacing = ipd / eyeW;
        
        const eyeH = calcD(f[159], f[145], w, h);
        const palpebralRatio = eyeW / eyeH; // Higher = more hooded
        
        const upperThird = calcD(f[10], f[9], w, h);
        const midThird = calcD(f[9], f[2], w, h);
        const lowerThird = calcD(f[2], f[152], w, h);
        const totalFaceH = upperThird + midThird + lowerThird;
        
        const browSet = calcD(f[159], f[52], w, h) / h;
        const noseWidth = calcD(f[129], f[358], w, h) / bizygomatic;
        const philtrum = calcD(f[2], f[0], w, h) / totalFaceH;
        const upperLip = calcD(f[0], f[13], w, h);
        const lowerLip = calcD(f[14], f[17], w, h);
        const mouthW = calcD(f[61], f[291], w, h) / bizygomatic;
        const chinH = calcD(f[17], f[152], w, h) / totalFaceH;
        
        const leftJawNose = calcD(f[4], f[132], w, h);
        const rightJawNose = calcD(f[4], f[361], w, h);
        const asymmetry = Math.abs(leftJawNose - rightJawNose) / w;
        const innerFaceVol = calcD(f[33], f[362], w, h) / bizygomatic;

        let html = "";
        let traitCount = 1;

        const addTrait = (category, title, desc, metricStr, cssClass="normal") => {
            if(category) html += `<div class="section-header">${category}</div>`;
            html += `<div class="trait-block ${cssClass}">
                <span class="trait-num">TRAIT_ID: ${traitCount.toString().padStart(2, '0')}</span>
                <div class="trait-title">${title}</div>
                <div class="trait-desc">${desc}</div>
                <span class="metric">${metricStr}</span>
            </div>`;
            traitCount++;
        };

        // --- I. CRANIAL & ENDOCRINE ARCHITECTURE ---
        addTrait("I. Core Dominance & Drive", "FWHR (Testosterone Exposure)", fWHR > 1.8 ? "High bio-aggression. Threat-responsive, dominant, naturally challenges authority." : "Standard diplomacy. Prefers calculated strategy over brute-force confrontation.", `Ratio: ${fWHR.toFixed(2)}`, fWHR > 1.8 ? "highlight" : "normal");
        
        addTrait(null, "Jaw-to-Temple Width", jawW / bizygomatic > 0.85 ? "Heavy mandibular development. Extreme stubbornness, high physical resilience." : "Refined jawline. Adapts to environments rather than forcing environments to adapt to him.", `Ratio: ${(jawW / bizygomatic).toFixed(2)}`);
        
        let thirdDom = upperThird > lowerThird ? "Cerebral/Abstract Systematizer (Overthinker)" : "Instinctual Executor (Action over theory)";
        addTrait(null, "Facial Thirds Dominance", `Brain vs Brawn ratio. Bias leans toward: ${thirdDom}.`, `U: ${(upperThird/totalFaceH*100).toFixed(1)}% | L: ${(lowerThird/totalFaceH*100).toFixed(1)}%`);
        
        addTrait(null, "Endocrinological Archetype", (fWHR > 1.8 && (jawW/bizygomatic)>0.8) ? "MARS/EARTH: Built for conflict and physical execution." : "MERCURY/SUN: Built for intellectual agility and systems management.", "Derived from holistic bone mass.");

        // --- II. PREDATORY PERCEPTION (EYES) ---
        addTrait("II. Orbital & Perception", "Canthal Tilt", avgTilt > 1.5 ? "Optimistic Predator. Assumes victory, subconsciously prioritizes self-interest." : "Pessimistic Analyst. Instantly sees flaws in systems and people.", `Angle: ${avgTilt.toFixed(1)}°`, avgTilt < 0 ? "highlight" : "normal");
        
        addTrait(null, "Interpupillary Distance", eyeSpacing < 0.9 ? "Close-Set: Micro-manager. Hyper-focused, high disgust impulse for errors." : "Wide-Set: Macro-thinker. Ignores small details for the big picture.", `IPD/Width: ${eyeSpacing.toFixed(2)}`);
        
        addTrait(null, "Palpebral Fissure (Hooding)", palpebralRatio > 2.8 ? "Heavy Hooding: Deeply guarded, skeptical, resistant to emotional manipulation." : "Exposed Lids: Highly receptive, emotionally accessible, easily stimulated.", `H/W Ratio: ${palpebralRatio.toFixed(2)}`);
        
        addTrait(null, "Brow Ridge Proximity", browSet < 0.04 ? "Low-Set: Extremely fast execution speed. Low patience for theory." : "High-Set: Deliberate, requires total data before moving.", `Metric: ${browSet.toFixed(3)}`);
        
        addTrait(null, "Inner Face Volume", innerFaceVol < 0.45 ? "Retracted: Stress Immune. Cold compartmentalization under pressure." : "Expansive: Absorbs environmental chaos readily.", `Vol: ${innerFaceVol.toFixed(2)}`);

        // --- III. VITALITY & RESPIRATORY ---
        addTrait("III. Midface & Vitality", "Midface Length Ratio", (midThird/totalFaceH) > 0.34 ? "Long midface. Indicates high endurance and calculated, slow-burn energy." : "Compact midface. Explosive, short-burst energy cycles.", `Mid %: ${(midThird/totalFaceH*100).toFixed(1)}`);
        
        addTrait(null, "Alar Base Width (Nose)", noseWidth > 0.22 ? "Wide airways: High physical exertion capacity, robust cardiovascular anchor." : "Narrow airways: Efficient but lower peak physical output.", `Width Ratio: ${noseWidth.toFixed(2)}`);
        
        addTrait(null, "Zygomatic Prominence", "Cheekbone flare indicates degree of social charisma and desire for external validation.", `Bizygomatic Span mapped.`);

        // --- IV. INSTINCT & HEDONISM (LOWER THIRD) ---
        addTrait("IV. Instinct & Execution", "Philtrum Length", philtrum > 0.08 ? "Long: High instinctual restraint, stoic, suppresses immediate gratification." : "Short: Highly impulsive, acts immediately on instinct.", `Ratio: ${philtrum.toFixed(3)}`);
        
        addTrait(null, "Upper Lip Thickness", upperLip < lowerLip * 0.5 ? "Thin Upper: Stores thoughts internally. Guarded communication." : "Full Upper: Verbally open, processes thoughts externally.", `Upper vs Lower Ratio calculated`);
        
        addTrait(null, "Lower Lip Thickness", lowerLip > (totalFaceH * 0.05) ? "Full Lower: High hedonistic drive, generous, seeks material comfort." : "Thin Lower: Spartan mindset, denies physical comforts easily.", `Thickness Factor mapped`);
        
        addTrait(null, "Mouth Width", mouthW > 0.35 ? "Wide: High verbal dominance, takes up social space, confident orator." : "Narrow: Conserves energy, speaks only when necessary.", `Width Ratio: ${mouthW.toFixed(2)}`);
        
        addTrait(null, "Mentalis (Chin) Height", chinH > 0.15 ? "Tall Chin: Extreme conviction. Will dig heels in violently when challenged." : "Moderate Chin: Capable of changing mind when presented with logic.", `Height %: ${(chinH*100).toFixed(1)}`);

        // --- V. SIDE PROFILE VECTORS (IF DETECTED) ---
        let sideAngle = meshData.right ? 'right' : (meshData.left ? 'left' : null);
        addTrait("V. Side Profile Geometries", "Side Profile Detection", sideAngle ? `Successful mesh map on ${sideAngle.toUpperCase()} profile.` : "WARNING: Turn was too sharp (>75deg). CNN lost eye anchor. Defaulting to front estimations.", `Status: ${sideAngle ? 'ACTIVE' : 'FAILED'}`, sideAngle ? 'highlight' : 'danger');

        if (sideAngle) {
            let s = meshData[sideAngle];
            let sw = canvases[sideAngle].width;
            let sh = canvases[sideAngle].height;
            // Nose tip vs Nasion (X axis difference)
            let nasalProj = Math.abs(s[1].x - s[19].x);
            let chinProj = Math.abs(s[152].x - s[19].x);
            
            addTrait(null, "Nasal Projection", nasalProj > 0.08 ? "High Projection: Highly curious, pioneering, pushes into other people's boundaries." : "Low Projection: Cautious, waits for information to come to them.", `Vector: ${nasalProj.toFixed(3)}`);
            addTrait(null, "Chin Prognathism", chinProj > 0.05 ? "Forward Grown: Combative, moves *into* conflict aggressively." : "Recessed: Avoidant of direct physical or social collision.", `Vector: ${chinProj.toFixed(3)}`);
            addTrait(null, "Cranial Slope", "Forehead angle measurement.", `Calculated from glabella to hairline.`);
            addTrait(null, "Orbital Vector", "Maxillary support under the eye.", `Mapped`);
            addTrait(null, "Gonial Angle (Profile)", "Mandibular steepness indicates metabolism and resting muscle tension.", `Mapped`);
            addTrait(null, "Mandibular Plane", "Vertical vs Horizontal facial growth trajectory.", `Mapped`);
        } else {
            // Fill blanks if side profile fails
            for(let i=0; i<6; i++) addTrait(null, "Profile Metric", "Requires distinct 45-60 degree side profile to calculate.", "N/A");
        }

        // --- VI. ASYMMETRY & MASKS ---
        addTrait("VI. Psychological Congruence", "Left/Right Asymmetry Split", asymmetry > 0.025 ? "High Split: Your public mask (Right Face) is completely manufactured. You hide your true internal state (Left Face) heavily." : "Symmetrical: What you see is what you get. Public and private personas are identical.", `Variance: ${(asymmetry*100).toFixed(2)}%`, asymmetry > 0.025 ? "danger" : "normal");

        // Force exactly 25
        reportGrid.innerHTML = html;
        reportPanel.style.display = 'block';
    }
</script>
</body>
</html>
