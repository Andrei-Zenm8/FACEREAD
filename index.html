<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FaceRead | Brutal Physiognomy Engine V2.1</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
    
    <style>
        :root { --brand: #00FF00; --bg: #050505; --panel: #0a0a0a; --text: #d0d0d0; --alert: #FF0033; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body { background-color: var(--bg); color: var(--text); padding: 15px; font-size: 13px; }
        header { text-align: center; margin-bottom: 20px; border-bottom: 1px solid #222; padding-bottom: 15px; }
        h1 { color: var(--brand); letter-spacing: 1px; font-size: 20px; margin-bottom: 5px;}
        
        .upload-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; margin-bottom: 10px; }
        .upload-btn { background: #111; color: var(--brand); border: 1px solid var(--brand); padding: 12px 5px; text-align: center; text-transform: uppercase; cursor: pointer; font-size: 11px; font-weight: bold; }
        .upload-btn:hover { background: var(--brand); color: #000; }
        input[type="file"] { display: none; }
        
        #executeBtn { width: 100%; background: var(--alert); color: #FFF; border: none; padding: 15px; font-size: 16px; font-weight: bold; text-transform: uppercase; cursor: pointer; margin-bottom: 20px; display: none; letter-spacing: 2px; }
        #executeBtn:hover { background: #CC0022; }

        .vision-container { display: flex; gap: 5px; overflow-x: auto; margin-bottom: 15px; padding-bottom: 5px; }
        .canvas-wrapper { position: relative; min-width: 150px; flex: 1; border: 1px solid #333; background: #000; min-height: 150px; }
        canvas { width: 100%; height: auto; display: block; }
        .angle-label { position: absolute; top: 2px; left: 4px; color: var(--brand); font-size: 10px; background: rgba(0,0,0,0.7); padding: 2px; z-index: 10; }
        
        .report-panel { background: var(--panel); border: 1px solid #222; display: none; margin-top: 10px; }
        .section-header { background: #111; color: var(--brand); padding: 8px; font-weight: bold; text-transform: uppercase; border-bottom: 1px solid #333; border-top: 1px solid #333; margin-top: 10px; }
        .trait-block { padding: 10px; border-bottom: 1px dashed #222; }
        .trait-title { color: #FFF; font-weight: bold; margin-bottom: 4px; font-size: 14px; }
        .trait-desc { color: #AAA; line-height: 1.5; }
        .metric { color: #555; font-size: 10px; display: block; margin-top: 4px; }
        .alert-text { color: var(--brand); font-weight: bold; }
        
        #loading { text-align: center; color: var(--brand); display: none; font-weight: bold; margin: 20px 0; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% {opacity: 1;} 50% {opacity: 0.3;} }
    </style>
</head>
<body>

    <header>
        <h1>FaceRead // Engine V2.1</h1>
        <p style="color: #666;">High-Dimensional Morphopsychology Matrix</p>
    </header>

    <div class="upload-grid">
        <label class="upload-btn" id="lbl-front">Front<input type="file" id="up-front" accept="image/*"></label>
        <label class="upload-btn" id="lbl-left">L-Profile<input type="file" id="up-left" accept="image/*"></label>
        <label class="upload-btn" id="lbl-right">R-Profile<input type="file" id="up-right" accept="image/*"></label>
    </div>

    <button id="executeBtn">Execute Analysis</button>

    <div class="vision-container">
        <div class="canvas-wrapper"><div class="angle-label">FRONT</div><canvas id="canv-front"></canvas></div>
        <div class="canvas-wrapper"><div class="angle-label">L-PROF</div><canvas id="canv-left"></canvas></div>
        <div class="canvas-wrapper"><div class="angle-label">R-PROF</div><canvas id="canv-right"></canvas></div>
    </div>
    
    <div id="loading">EXTRACTING CRANIAL GEOMETRY...</div>
    <div class="report-panel" id="report"></div>

<script>
    const inputs = { front: document.getElementById('up-front'), left: document.getElementById('up-left'), right: document.getElementById('up-right') };
    const canvases = { front: document.getElementById('canv-front'), left: document.getElementById('canv-left'), right: document.getElementById('canv-right') };
    const executeBtn = document.getElementById('executeBtn');
    const loading = document.getElementById('loading');
    const report = document.getElementById('report');
    
    // Store original image data to run inference on later
    let sourceImages = { front: null, left: null, right: null };
    let frontMetrics = null;

    const faceMesh = new FaceMesh({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`});
    faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
    faceMesh.onResults(processFrontResults);

    // Handle Image Uploads (Draw to canvas immediately, but do NOT analyze yet)
    Object.keys(inputs).forEach(angle => {
        inputs[angle].addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(!file) return;
            
            // Mark button as uploaded
            document.getElementById(`lbl-${angle}`).style.background = '#333';
            
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const canv = canvases[angle];
                    const ctx = canv.getContext('2d');
                    canv.width = img.width;
                    canv.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    sourceImages[angle] = img;
                    
                    // Show Execute button once Front is uploaded (Front is mandatory)
                    if(sourceImages.front) {
                        executeBtn.style.display = 'block';
                    }
                };
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        });
    });

    // Run Analysis Button Click
    executeBtn.addEventListener('click', async () => {
        if (!sourceImages.front) {
            alert("Front image is required to extract the geometric matrix.");
            return;
        }
        
        executeBtn.style.display = 'none';
        report.style.display = 'none';
        loading.style.display = 'block';
        
        // Send the Front image to the CNN
        await faceMesh.send({image: sourceImages.front});
    });

    function calcDist(p1, p2, w, h) { return Math.sqrt(Math.pow((p1.x - p2.x)*w, 2) + Math.pow((p1.y - p2.y)*h, 2)); }
    function calcAngle(p1, p2) { return Math.atan2(p2.y - p1.y, p2.x - p1.x) * (180 / Math.PI); }

    function processFrontResults(results) {
        loading.style.display = 'none';
        
        if (!results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0) {
            alert("ERROR: Could not detect facial landmarks on the Front image. Please ensure good lighting.");
            executeBtn.style.display = 'block';
            return;
        }
        
        const lm = results.multiFaceLandmarks[0];
        const canv = canvases.front;
        const ctx = canv.getContext('2d');
        const w = canv.width, h = canv.height;

        // Draw mesh on front canvas
        ctx.strokeStyle = 'rgba(0, 255, 0, 0.6)'; ctx.lineWidth = 1.5;
        lm.forEach(p => { ctx.beginPath(); ctx.arc(p.x*w, p.y*h, 1, 0, 2*Math.PI); ctx.stroke(); });

        // Calculate Metrics
        frontMetrics = {
            fwhr: calcDist(lm[234], lm[454], w, h) / calcDist(lm[10], lm[152], w, h),
            jawWidth: calcDist(lm[132], lm[361], w, h) / calcDist(lm[234], lm[454], w, h),
            lTilt: calcAngle(lm[33], lm[133]), rTilt: calcAngle(lm[362], lm[263]),
            innerFaceRatio: calcDist(lm[33], lm[362], w, h) / calcDist(lm[234], lm[454], w, h),
            eyeSpacing: calcDist(lm[133], lm[362], w, h) / calcDist(lm[33], lm[133], w, h),
            browSet: calcDist(lm[159], lm[52], w, h) / h,
            lUpperLip: calcDist(lm[0], lm[13], w, h), lLowerLip: calcDist(lm[14], lm[17], w, h),
            asymmetry: Math.abs(calcDist(lm[4], lm[132], w, h) - calcDist(lm[4], lm[361], w, h)) / w
        };
        
        generateBrutalReport();
        executeBtn.style.display = 'block';
        executeBtn.innerText = "RE-CALCULATE MATRIX";
    }

    function generateBrutalReport() {
        if(!frontMetrics) return;
        const f = frontMetrics;
        let html = "";

        const addBlock = (title, desc, data, alert=false) => {
            html += `<div class="trait-block">
                <div class="trait-title ${alert?'alert-text':''}">${title}</div>
                <div class="trait-desc">${desc}</div>
                <span class="metric">${data}</span>
            </div>`;
        };

        // 1. TEMPERAMENT & ARCHETYPE
        html += `<div class="section-header">I. Core Architecture & Dominance</div>`;
        if (f.fwhr > 1.85 && f.jawWidth > 0.8) {
            addBlock("Mars / Earth Archetype (Warrior/Farmer)", "High bone density, wide jaw, and dominant cheekbones. Indicates elevated testosterone exposure, high confrontation threshold, results-focused materialism, and stoic determination. Highly decisive, often blunt.", `[fWHR: ${f.fwhr.toFixed(2)}] [Jaw Ratio: ${f.jawWidth.toFixed(2)}]`);
        } else if (f.jawWidth > 0.85 && f.fwhr < 1.7) {
            addBlock("Jupiter / Saturn Archetype (Judge/Accountant)", "Broad lower face with a narrower upper face. Deeply moralistic, orderly, and highly judgmental. Extremely diligent worker, often prone to intense overwork and long-term planning without immediate reward.", `[Jaw-to-Temple Ratio: ${f.jawWidth.toFixed(2)}]`);
        } else {
            addBlock("Mercury / Sun Archetype (Magician/Aristocrat)", "Narrower, more refined geometry. High sensitivity to external stimuli, rapid cognitive processing. Relies on intellect, wit, and systems thinking over brute physical execution.", `[fWHR: ${f.fwhr.toFixed(2)}]`);
        }

        // 2. SOCIAL DYNAMICS
        html += `<div class="section-header">II. Perception & Tolerance</div>`;
        const avgTilt = -((f.lTilt + f.rTilt) / 2);
        if (avgTilt > 1.5) {
            addBlock("Positive Canthal Tilt: The Rebellious Predator", "Subconsciously prioritizes own interests over group consensus. Highly confident, optimistic, but completely ruthless when challenged. Expects to win.", `[Tilt: +${avgTilt.toFixed(1)}°]`);
        } else {
            addBlock("Negative Canthal Tilt: The Critical Analyst", "Pessimistic flaw-detector. Focuses instantly on what is broken or inefficient. Extremely high accuracy in work, but highly critical and untrusting of others.", `[Tilt: ${avgTilt.toFixed(1)}°]`);
        }

        if (f.eyeSpacing < 0.9) {
            addBlock("Close-Set Eyes: High Disgust Impulse", "Incapable of ignoring flaws. Micro-managerial, highly meticulous, and prone to high disgust responses toward social degeneracy or inefficiency. Cannot tolerate 'big picture' vagueness.", `[Spacing Ratio: ${f.eyeSpacing.toFixed(2)}]`);
        } else {
            addBlock("Wide-Set Eyes: Broad Tolerance", "Big-picture focused. Tolerant of deviations and chaos, but heavily misses critical operational details.", `[Spacing Ratio: ${f.eyeSpacing.toFixed(2)}]`);
        }

        // 3. STRESS IMMUNITY
        html += `<div class="section-header">III. Stress & Internal Capacity</div>`;
        if (f.innerFaceRatio < 0.45) {
            addBlock("Retracted Inner Face: Stress Immune", "Cold, aloof, and capable of extreme compartmentalization. Does not easily absorb the emotional panic of others. Often perceived as unfeeling or Machiavellian under pressure.", `[Inner Face Vol: ${f.innerFaceRatio.toFixed(2)}]`);
        } else {
            addBlock("Exposed Inner Face: Highly Reactive", "High emotional receptivity. Rapidly absorbs environmental stress and social dynamics. Driven by external feedback.", `[Inner Face Vol: ${f.innerFaceRatio.toFixed(2)}]`);
        }

        if (f.browSet < 0.04) {
            addBlock("Low-Set Brows: Rapid Execution", "Acts immediately on information. Low tolerance for endless deliberation. Direct, bottom-line focused.", `[Brow Distance: ${f.browSet.toFixed(3)}]`);
        }

        // 4. MASKS & COMMUNICATION
        html += `<div class="section-header">IV. Persona & Communication</div>`;
        const lipRatio = f.lLowerLip / f.lUpperLip;
        if (lipRatio > 2.0) {
            addBlock("Thin Upper / Full Lower Lip: The Siloed Self", "Extremely hesitant to express true thoughts to the outside world, but possesses a massive, deeply felt internal sense of self. Stores opinions internally.", `[Lip Imbalance Ratio: ${lipRatio.toFixed(2)}]`);
        }

        if (f.asymmetry > 0.025) {
            addBlock("High Asymmetry: Fractured Persona", "Extreme difference between the left (true self) and right (public mask). The public persona is a completely manufactured armor used to navigate the world, entirely distinct from the inner nature.", `[Asymmetry Factor: ${f.asymmetry.toFixed(3)}]`, true);
        } else {
            addBlock("Symmetrical Integration", "What you see is what you get. Public actions are directly congruent with private thoughts. Low propensity for two-faced behavior.", `[Asymmetry Factor: ${f.asymmetry.toFixed(3)}]`);
        }

        report.innerHTML = html;
        report.style.display = 'block';
    }
</script>
</body>
</html>
